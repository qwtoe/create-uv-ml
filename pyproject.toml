[project]
name = "create-uv-ml"
version = "0.1.0"
description = "A CLI scaffolding tool to quickly bootstrap deep learning projects with uv"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[project.scripts]
create-uv-ml = "create_uv_ml.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/create_uv_ml"]
